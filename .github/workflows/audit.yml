# Dependency audit gate.
#
# Dependabot opens PRs when an advisory lands against a package we depend on.
# This is the other half: it catches advisories on code nobody is touching,
# and stops a PR from merging a vulnerable lockfile.
#
# The schedule matters more than it looks — an advisory published against an
# unchanged lockfile produces no commit and no PR, so without a cron nothing
# would ever run to notice it. Weekly, matching the Dependabot cadence.
name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 14:00 US Central, so the run lands during the working day.
    #
    # Actions cron is UTC only and does not follow daylight saving, so this
    # is pinned to 19:00 UTC = 14:00 CDT. From November to March, when
    # Central is on CST, it arrives at 13:00 local instead. To hold 14:00
    # through the winter, change this to "0 20 * * 1".
    - cron: "0 19 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Fails the job on high and critical advisories. These are the ones
      # worth blocking a merge over.
      - name: Audit (high and critical block)
        run: npm audit --audit-level=high

      # Moderate and low are reported, not enforced: an unfixable moderate
      # should not be able to wedge the repo. It still shows up in the job
      # summary so it gets triaged rather than silently accumulating.
      - name: Report moderate and low
        if: always()
        run: |
          {
            echo "### npm audit"
            echo
            echo '```'
            npm audit --audit-level=low || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The deploy workflow already builds, but only on main. This proves a
  # dependency bump still builds before it is merged.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://darshanvishwanath.com
          BASE_PATH: /
